<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f3ec"/>
      <stop offset="50%" stop-color="#f1ebe0"/>
      <stop offset="100%" stop-color="#e8e0d2"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fdfbf7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24211e"/>
      <stop offset="100%" stop-color="#3d3833"/>
    </linearGradient>

    <!-- Soft shadow filter -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#24211e" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#24211e" flood-opacity="0.08"/>
    </filter>

    <filter id="stampShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#c85a32" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background with delicate grid / paper grain illusion -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Outer decorative border frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#dfd6c8" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Main Central Paper Card -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="65" width="1060" height="500" rx="20" fill="url(#cardGrad)" stroke="#e4dbce" stroke-width="1.5"/>
  </g>

  <!-- Left Accent Ribbon / Bar -->
  <rect x="70" y="65" width="10" height="500" rx="4" fill="#c85a32"/>

  <!-- Header Category / Status Tag -->
  <g transform="translate(120, 115)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#24211e"/>
    <circle cx="18" cy="17" r="4.5" fill="#34d399"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f5f1eb" letter-spacing="1">AVAILABLE FOR WORK</text>
  </g>

  <!-- Tech tags top right -->
  <g transform="translate(860, 115)">
    <rect x="0" y="0" width="220" height="34" rx="8" fill="#efe9dc" stroke="#dfd7c9" stroke-width="1"/>
    <text x="110" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#686259" text-anchor="middle" letter-spacing="0.5">DEV PORTFOLIO · 2026</text>
  </g>

  <!-- Main Name Header -->
  <text x="120" y="225" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="bold" fill="#181614" letter-spacing="-1.5">Sachit</text>

  <!-- Subtitle / Roles -->
  <text x="120" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#c85a32" letter-spacing="-0.2">Software Developer &amp; Prompt Engineer</text>

  <!-- Short Bio Summary -->
  <text x="120" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#58524a">
    Building full-stack web apps, Android platforms, LLM integrations &amp; automated workflows.
  </text>

  <!-- Divider Line -->
  <line x1="120" y1="365" x2="1080" y2="365" stroke="#e6ded1" stroke-width="1.5"/>

  <!-- Project Pills & Highlights -->
  <g transform="translate(120, 395)">
    <!-- Pill 1: SKY ROMs -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="#f4ede1" stroke="#dfd5c4" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#24211e">⚡ SKY ROMs</text>
    </g>

    <!-- Pill 2: MoneyPal -->
    <g transform="translate(195, 0)">
      <rect width="170" height="42" rx="10" fill="#f4ede1" stroke="#dfd5c4" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#24211e">📱 MoneyPal</text>
    </g>

    <!-- Pill 3: Audify -->
    <g transform="translate(380, 0)">
      <rect width="150" height="42" rx="10" fill="#f4ede1" stroke="#dfd5c4" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#24211e">🎵 Audify</text>
    </g>

    <!-- Pill 4: AI MCP Tool -->
    <g transform="translate(545, 0)">
      <rect width="180" height="42" rx="10" fill="#f4ede1" stroke="#dfd5c4" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#24211e">🤖 AI MCP Tool</text>
    </g>
  </g>

  <!-- Bottom Footer Info -->
  <g transform="translate(120, 505)">
    <text x="0" y="0" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="600" fill="#756e64">🌐 sachin-portfoli.vercel.app</text>
    <text x="960" y="0" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="500" fill="#999185" text-anchor="end">React · TypeScript · Python · Android</text>
  </g>

  <!-- Verified Craftsmanship Stamp in bottom right of card -->
  <g transform="translate(980, 200)" filter="url(#stampShadow)">
    <circle cx="50" cy="50" r="42" fill="none" stroke="#c85a32" stroke-width="2.5" stroke-dasharray="4 3"/>
    <circle cx="50" cy="50" r="36" fill="none" stroke="#c85a32" stroke-width="1.2"/>
    <text x="50" y="44" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#c85a32" text-anchor="middle" letter-spacing="1">VERIFIED</text>
    <text x="50" y="58" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#c85a32" text-anchor="middle" letter-spacing="0.5">ORIGINAL</text>
    <text x="50" y="70" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" fill="#c85a32" text-anchor="middle">2026</text>
  </g>
</svg>
